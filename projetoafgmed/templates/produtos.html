<!-- produtos.html -->
{% extends "base.html" %}

{% block content %}
<h1>Produtos</h1>
<div class="produtos-container">
    {% for produto in produtos %}
    <div class="card card-produto">
        <img src="{{ url_for('static', filename='fotos_produtos/' + produto.foto) }}"
             alt="{{ produto.nome }}" class="card-imagem">
        <div class="card-body">
            <h2>{{ produto.nome }}</h2>
            <p>{{ produto.descricao }}</p>
            <p><strong>R$ {{ '%.2f' % produto.preco }}</strong></p>
            <p>Estoque: {{ produto.estoque }}</p>
        </div>
    </div>
    {% else %}
    <p>Nenhum produto cadastrado.</p>
    {% endfor %}
</div>

<style>
.produtos-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: flex-start;
}

.card-produto {
    width: 280px;       /* largura fixa para desktop */
    min-height: 420px;  /* altura mínima do card */
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    overflow: hidden;
    background-color: #fff;
    display: flex;
    flex-direction: column;
}

.card-produto img.card-imagem {
    width: 100%;        /* ocupa toda largura do card */
    max-height: 200px;  /* altura máxima da imagem */
    object-fit: contain; /* mantém proporção */
    display: block;
    margin: 0 auto;
}

.card-body {
    padding: 15px;
    flex-grow: 1;
}

.card-body h2 {
    font-size: 1.2rem;
    margin: 0 0 10px;
}

.card-body p {
    font-size: 0.95rem;
    margin: 5px 0;
}

/* Responsivo para telas menores que 768px */
@media (max-width: 768px) {
    .produtos-container {
        justify-content: center;
    }
    .card-produto {
        width: 90%;       /* ocupa quase toda a tela em mobile */
        min-height: auto;
    }
}
</style>

{% endblock %}
