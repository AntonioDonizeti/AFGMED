{% extends "base.html" %}
{% block title %}Pagamento aprovado{% endblock %}

{% block content %}
<div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,.45);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-compra-sucesso">
            <div class="modal-body text-center p-5">

                <div class="compra-sucesso-icon">
                    <i class="bi bi-check-lg"></i>
                </div>

                <h3 class="fw-bold mt-4 mb-2">
                    Pagamento aprovado!
                </h3>

                <p class="text-muted mb-4">
                    Sua compra foi confirmada e será preparada para entrega.
                </p>

                <a href="{{ url_for('homepage') }}" class="btn btn-primary w-100">
                    Voltar para Home
                </a>

            </div>
        </div>
    </div>
</div>
{% endblock %}
