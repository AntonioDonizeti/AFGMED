{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Marcar consulta com Dr(a). {{ medico.nome }}</h2>

    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label for="paciente_nome" class="form-label">Seu nome</label>
            <input type="text" class="form-control" id="paciente_nome" name="paciente_nome" required>
        </div>
        <div class="mb-3">
            <label for="horario" class="form-label">Escolha um horário</label>
            <select class="form-select" id="horario" name="horario" required>
                {% for h in horarios %}
                    {% set ocupado = consultas|selectattr('horario','equalto',h)|list %}
                    <option value="{{ h }}" {% if ocupado %}disabled{% endif %}>
                        {{ h }} {% if ocupado %}- Ocupado{% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Marcar consulta</button>
    </form>

    <hr>
    <h4>Consultas já marcadas:</h4>
    <ul class="list-group mt-2">
        {% for c in consultas %}
            <li class="list-group-item">{{ c.paciente_nome }} - {{ c.horario }}</li>
        {% else %}
            <li class="list-group-item">Nenhuma consulta marcada ainda.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
