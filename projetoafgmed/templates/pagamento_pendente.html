{% extends "base.html" %}
{% block title %}Pagamento pendente{% endblock %}

{% block content %}
<div class="card mx-auto text-center p-4" style="max-width: 520px;">
    <div class="card-body">
        <i class="bi bi-clock-history text-warning" style="font-size: 4rem;"></i>

        <h3 class="fw-bold mt-3" style="color:#072B59;">
            Pagamento pendente
        </h3>

        <p class="text-muted">
            Seu pagamento ainda está sendo processado. Assim que for aprovado, o pedido será confirmado.
        </p>

        <a href="{{ url_for('homepage') }}" class="btn btn-primary">
            Voltar para Home
        </a>
    </div>
</div>
{% endblock %}
