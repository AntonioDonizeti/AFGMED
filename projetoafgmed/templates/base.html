<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AFGMED{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('homepage') }}">
            <img src="{{ url_for('static', filename='imagens/logo.jpg') }}" alt="Logo" width="50" class="me-2">
            AFGMED
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('homepage') }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('medicos') }}">Equipe</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('produtos') }}">Produtos</a></li>

                {% if current_user.is_authenticated %}
                    {% if current_user.is_admin %}
                        <li class="nav-item ms-2"><a class="btn btn-primary" href="{{ url_for('cadastro_medico') }}">Cadastrar Médico</a></li>
                        <li class="nav-item ms-2"><a class="btn btn-primary" href="{{ url_for('cadastro_produto') }}">Cadastrar Produto</a></li>
                    {% endif %}
                    <li class="nav-item ms-2"><a class="btn btn-success" href="{{ url_for('logout') }}">Logout</a></li>
                {% else %}
                    <li class="nav-item ms-2"><a class="btn btn-primary" href="{{ url_for('criar_conta') }}">Criar Conta</a></li>
                    <li class="nav-item ms-2"><a class="btn btn-success" href="{{ url_for('login') }}">Login</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
