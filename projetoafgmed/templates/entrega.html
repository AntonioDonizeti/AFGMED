{% extends "base.html" %}
{% block title %}Entrega{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Informações de Entrega e Pagamento</h2>

    <form method="POST">
        <h4>Endereço de Entrega</h4>
        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="endereco" name="endereco"
                   value="{{ current_user.perfil.endereco if current_user.perfil else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade"
                       value="{{ current_user.perfil.cidade if current_user.perfil else '' }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label for="estado" class="form-label">Estado</label>
                <input type="text" class="form-control" id="estado" name="estado"
                       value="{{ current_user.perfil.estado if current_user.perfil else '' }}" required>
            </div>
            <div class="col-md-3 mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" name="cep"
                       value="{{ current_user.perfil.cep if current_user.perfil else '' }}" required>
            </div>
        </div>

        <h4 class="mt-4">Dados de Pagamento</h4>
        <div class="mb-3">
            <label for="numero_cartao" class="form-label">Número do Cartão</label>
            <input type="text" class="form-control" id="numero_cartao" name="numero_cartao"
                   value="{{ current_user.perfil.numero_cartao if current_user.perfil else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="nome_cartao" class="form-label">Nome no Cartão</label>
            <input type="text" class="form-control" id="nome_cartao" name="nome_cartao"
                   value="{{ current_user.perfil.nome_cartao if current_user.perfil else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="validade_cartao" class="form-label">Validade (MM/AA)</label>
                <input type="text" class="form-control" id="validade_cartao" name="validade_cartao"
                       value="{{ current_user.perfil.validade_cartao if current_user.perfil else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="cvv" class="form-label">CVV</label>
                <input type="text" class="form-control" id="cvv" name="cvv"
                       value="{{ current_user.perfil.cvv if current_user.perfil else '' }}" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4">Finalizar Compra</button>
    </form>
</div>
{% endblock %}
