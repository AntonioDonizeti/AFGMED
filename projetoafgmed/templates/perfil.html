{% extends "base.html" %}
{% block title %}Perfil{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold mb-4" style="color:#072B59;">Meu Perfil</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="row mb-4">

            <div class="col-md-3 text-center mb-4">
                <label class="fw-semibold mb-2">Foto de perfil</label><br>

                <img src="{{ url_for('static', filename='fotos_perfil/' + (usuario.foto or 'usuario_padrao.jpg')) }}"
                     class="mb-2 rounded-circle border"
                     style="width:150px; height:150px; object-fit:cover;">

                <input type="file" name="foto" class="form-control mt-2">
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <h4 class="fw-bold mb-3" style="color:#072B59;">
                            Dados Pessoais
                        </h4>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Nome</label>
                                <input type="text"
                                       name="nome"
                                       class="form-control"
                                       value="{{ usuario.nome }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Sobrenome</label>
                                <input type="text"
                                       name="sobrenome"
                                       class="form-control"
                                       value="{{ usuario.sobrenome }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       value="{{ usuario.email }}">
                            </div>
                        </div>

                        <hr class="my-4">

                        <h4 class="fw-bold mb-3" style="color:#072B59;">
                            Endereço
                        </h4>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Endereço</label>
                                <input type="text"
                                       name="endereco"
                                       class="form-control"
                                       value="{{ perfil.endereco or '' }}">
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label">Cidade</label>
                                <input type="text"
                                       name="cidade"
                                       class="form-control"
                                       value="{{ perfil.cidade or '' }}">
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label">Estado</label>
                                <input type="text"
                                       name="estado"
                                       class="form-control"
                                       value="{{ perfil.estado or '' }}">
                            </div>

                            <div class="col-md-3 mb-3">
                                <label class="form-label">CEP</label>
                                <input type="text"
                                       name="cep"
                                       class="form-control"
                                       value="{{ perfil.cep or '' }}">
                            </div>
                        </div>

                        <div class="alert alert-light border rounded-4 mt-3">
                            <div class="d-flex gap-2 align-items-start">
                                <i class="bi bi-shield-check text-success"></i>
                                <small class="text-muted">
                                    Os dados de pagamento não ficam salvos no perfil.
                                    O pagamento será feito em ambiente seguro do Mercado Pago.
                                </small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">
                            Salvar Alterações
                        </button>

                    </div>
                </div>
            </div>

        </div>
    </form>
</div>
{% endblock %}
